<style>
:root{--bg:#fff;--sf:#f9fafb;--bd:#e5e7eb;--tx:#111827;--mu:#6b7280;--g:rgba(0,0,0,.06);--tk:#9ca3af;--sc:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--sf:#1a1d27;--bd:#2d3148;--tx:#f1f5f9;--mu:#94a3b8;--g:rgba(255,255,255,.07);--tk:#94a3b8;--sc:#0f1117}}
:root[data-theme="dark"]{--bg:#0f1117;--sf:#1a1d27;--bd:#2d3148;--tx:#f1f5f9;--mu:#94a3b8;--g:rgba(255,255,255,.07);--tk:#94a3b8;--sc:#0f1117}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Inter",sans-serif;padding:8px 8px 0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px 20px 14px;margin-bottom:20px}
.g{stroke:var(--g);stroke-width:1;fill:none}
.tick{fill:var(--tk);font-size:10px;font-family:-apple-system,sans-serif}
.evlbl{fill:var(--tk);font-size:11px;font-family:-apple-system,sans-serif;text-anchor:middle}
.axlbl{fill:var(--tk);font-size:10px;font-family:-apple-system,sans-serif}
.ax{stroke:var(--bd);stroke-width:1;fill:none}
.sc{fill:var(--sc)}
.ti{display:none}
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:5px 13px;border-radius:6px;border:1px solid var(--bd);background:var(--sf);color:var(--mu);cursor:pointer;font-size:.8rem;font-weight:500;transition:all .15s;user-select:none}
.tab:hover{background:var(--bd)}
.panel{display:none}
#t0:checked~.panels #p0{display:block}#t0:checked~.tabbar label[for="t0"]{background:var(--text);color:var(--bg);border-color:var(--text)}#t1:checked~.panels #p1{display:block}#t1:checked~.tabbar label[for="t1"]{background:var(--text);color:var(--bg);border-color:var(--text)}#t2:checked~.panels #p2{display:block}#t2:checked~.tabbar label[for="t2"]{background:var(--text);color:var(--bg);border-color:var(--text)}#t3:checked~.panels #p3{display:block}#t3:checked~.tabbar label[for="t3"]{background:var(--text);color:var(--bg);border-color:var(--text)}#t4:checked~.panels #p4{display:block}#t4:checked~.tabbar label[for="t4"]{background:var(--text);color:var(--bg);border-color:var(--text)}#t5:checked~.panels #p5{display:block}#t5:checked~.tabbar label[for="t5"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.cb{position:relative;width:100%;overflow:hidden}
.lh,.dh{position:absolute;cursor:crosshair;pointer-events:auto}
[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font-size:11px;line-height:1.65;white-space:pre;z-index:50;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.12);font-family:-apple-system,sans-serif;min-width:160px}
.ll[data-tooltip]:hover::after,.dl[data-tooltip]:hover::after{left:auto;right:0;transform:none}
.lr{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.leg{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--mu)}
.ld{display:inline-block;width:22px;border-radius:2px}
.dbl{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--bd);align-items:center}
.dl2{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--mu)}
.ct{font-size:.875rem;font-weight:600;margin-bottom:2px}
.cw{font-size:.75rem;color:var(--mu);margin-bottom:10px}
</style>
</head>
